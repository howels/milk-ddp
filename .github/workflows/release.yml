name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build/publish (e.g. v0.1.2)"
        required: true
        default: ""

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      projectm: ${{ steps.projectm.outputs.tag }}
    steps:
      - name: Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "${TAG}" in
            v[0-9]*) ;;
            *)
              echo "error: tag must look like v0.1.2 (got: ${TAG})" >&2
              exit 1
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ver.outputs.tag }}

      - name: Require tag on main
        run: |
          COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${COMMIT}" origin/main; then
            echo "error: ${COMMIT} is not on origin/main; refuse release for ${{ steps.ver.outputs.tag }}" >&2
            exit 1
          fi
          echo "OK: ${{ steps.ver.outputs.tag }} @ ${COMMIT} is reachable from origin/main"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ git pkg-config make \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri \
            libpulse-dev libasound2-dev \
            mesa-utils python3

      - name: Record libprojectM tag
        id: projectm
        run: |
          TAG=$(sed -n 's/.*MILK_DDP_PROJECTM_GIT_TAG "\([^"]*\)".*/\1/p' CMakeLists.txt | head -1)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Validate
        run: bash tests/validate.sh
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

      - name: Stage binary archive
        run: |
          STAGE="milk-ddp-${{ steps.ver.outputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "${STAGE}"
          cp -a build/milk-ddp "${STAGE}/"
          cp -a LICENSE THIRD_PARTY.md README.md "${STAGE}/"
          cp -a presets "${STAGE}/"
          printf '%s\n' \
            "milk-ddp ${{ steps.ver.outputs.tag }}" \
            "libprojectM ${{ steps.projectm.outputs.tag }}" \
            "arch ${{ matrix.arch }}" \
            "built-on $(uname -srm)" \
            "commit $(git rev-parse HEAD)" \
            > "${STAGE}/BUILD_INFO.txt"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"

      - name: Build container images
        run: |
          mkdir -p third_party && touch third_party/.gitkeep
          # Alpine is the preferred release image. Publish to GHCR only (no docker-save assets).
          docker build -f Dockerfile.alpine \
            -t "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-alpine-${{ matrix.arch }}" \
            -t "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-${{ matrix.arch }}" \
            .
          docker build -f Dockerfile.debian \
            -t "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-debian-${{ matrix.arch }}" \
            .

      - name: Smoke-test container images
        run: |
          smoke() {
            local image="$1"
            docker run --rm "${image}" \
              --software-gl --preset-path /usr/share/milk-ddp/presets --help
            docker run --rm --entrypoint sh "${image}" -c '
              set -eu
              test -f /usr/share/milk-ddp/presets/butterchurn/LICENSE
              milk_n=$(find /usr/share/milk-ddp/presets/butterchurn -maxdepth 1 -name "*.milk" | wc -l)
              test "${milk_n}" -ge 500
              python3 /usr/libexec/milk-ddp/ddp_listen.py \
                --bind 127.0.0.1 --port 19049 --width 64 --height 64 \
                --frames 2 --timeout 60 &
              LISTEN_PID=$!
              sleep 0.3
              milk-ddp --software-gl --width 64 --height 64 --fps 15 --frames 2 \
                --ddp 127.0.0.1:19049 \
                --preset-path /usr/share/milk-ddp/presets/lowres \
                --audio sine --quiet --no-warm-presets
              wait "${LISTEN_PID}"
            '
          }
          TAG="${{ steps.ver.outputs.tag }}"
          REPO="ghcr.io/${{ github.repository }}"
          smoke "${REPO}:${TAG}-alpine-${{ matrix.arch }}"
          smoke "${REPO}:${TAG}-debian-${{ matrix.arch }}"

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push arch images to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-alpine-${{ matrix.arch }}"
          docker push "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-${{ matrix.arch }}"
          docker push "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-debian-${{ matrix.arch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            milk-ddp-${{ steps.ver.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          REPO="ghcr.io/${{ github.repository }}"
          # Preferred: :vX and :vX-alpine (Alpine). Debian: :vX-debian.
          docker buildx imagetools create -t "${REPO}:${TAG}" \
            "${REPO}:${TAG}-amd64" \
            "${REPO}:${TAG}-arm64"
          docker buildx imagetools create -t "${REPO}:${TAG}-alpine" \
            "${REPO}:${TAG}-alpine-amd64" \
            "${REPO}:${TAG}-alpine-arm64"
          docker buildx imagetools create -t "${REPO}:${TAG}-debian" \
            "${REPO}:${TAG}-debian-amd64" \
            "${REPO}:${TAG}-debian-arm64"
          # Also tag :latest on Alpine preferred image for the newest release.
          docker buildx imagetools create -t "${REPO}:latest" \
            "${REPO}:${TAG}-alpine-amd64" \
            "${REPO}:${TAG}-alpine-arm64"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          overwrite_files: true
          generate_release_notes: true
          body: |
            ## milk-ddp ${{ needs.build.outputs.tag }}

            Headless projectM → DDP for WLED matrices.

            **libprojectM:** ${{ needs.build.outputs.projectm }} (LGPL-2.1-or-later) — see `THIRD_PARTY.md` in the host tarball.

            ### Host binaries
            - `milk-ddp-${{ needs.build.outputs.version }}-linux-amd64.tar.gz`
            - `milk-ddp-${{ needs.build.outputs.version }}-linux-arm64.tar.gz`

            ### Container images (GHCR)
            Alpine is preferred (`:latest` / `:${{ needs.build.outputs.tag }}`). Multi-arch manifests cover amd64 and arm64.

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}-alpine
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}-debian
            ```

            Single-arch tags: `${{ needs.build.outputs.tag }}-alpine-amd64`, `${{ needs.build.outputs.tag }}-alpine-arm64`, `${{ needs.build.outputs.tag }}-debian-amd64`, `${{ needs.build.outputs.tag }}-debian-arm64`.

            In-tree preset packs ship in the host tarball and container image, including **`presets/butterchurn/`** (504 MIT MilkDrop `.milk` files from jberg/butterchurn-presets). Large external packs (Cream of the Crop, textures) are **not** bundled; see `presets/README.md`.
          files: |
            milk-ddp-${{ needs.build.outputs.version }}-linux-amd64.tar.gz
            milk-ddp-${{ needs.build.outputs.version }}-linux-arm64.tar.gz
