name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build (for manual runs without a push)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      projectm: ${{ steps.projectm.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ git pkg-config make \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri \
            libpulse-dev libasound2-dev \
            mesa-utils python3

      - name: Record libprojectM tag
        id: projectm
        run: |
          TAG=$(sed -n 's/.*MILK_DDP_PROJECTM_GIT_TAG "\([^"]*\)".*/\1/p' CMakeLists.txt | head -1)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Validate
        run: bash tests/validate.sh
        env:
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

      - name: Stage binary archive
        run: |
          STAGE="milk-ddp-${{ steps.ver.outputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "${STAGE}"
          cp -a build/milk-ddp "${STAGE}/"
          cp -a LICENSE THIRD_PARTY.md README.md "${STAGE}/"
          cp -a presets "${STAGE}/"
          printf '%s\n' \
            "milk-ddp ${{ steps.ver.outputs.tag }}" \
            "libprojectM ${{ steps.projectm.outputs.tag }}" \
            "arch ${{ matrix.arch }}" \
            "built-on $(uname -srm)" \
            "commit ${GITHUB_SHA}" \
            > "${STAGE}/BUILD_INFO.txt"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"

      - name: Build container images
        run: |
          mkdir -p third_party && touch third_party/.gitkeep
          # Alpine is the preferred release image.
          docker build -f Dockerfile.alpine \
            -t "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-alpine-${{ matrix.arch }}" \
            -t "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-${{ matrix.arch }}" \
            .
          docker build -f Dockerfile.debian \
            -t "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-debian-${{ matrix.arch }}" \
            .
          docker save \
            "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-alpine-${{ matrix.arch }}" \
            | gzip > "milk-ddp-${{ steps.ver.outputs.version }}-alpine-${{ matrix.arch }}.tar.gz"
          docker save \
            "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-debian-${{ matrix.arch }}" \
            | gzip > "milk-ddp-${{ steps.ver.outputs.version }}-debian-${{ matrix.arch }}.tar.gz"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push arch images to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-alpine-${{ matrix.arch }}"
          docker push "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-${{ matrix.arch }}"
          docker push "ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}-debian-${{ matrix.arch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            milk-ddp-${{ steps.ver.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            milk-ddp-${{ steps.ver.outputs.version }}-alpine-${{ matrix.arch }}.tar.gz
            milk-ddp-${{ steps.ver.outputs.version }}-debian-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          REPO="ghcr.io/${{ github.repository }}"
          # Preferred: :vX and :vX-alpine (Alpine). Debian: :vX-debian.
          docker buildx imagetools create -t "${REPO}:${TAG}" \
            "${REPO}:${TAG}-amd64" \
            "${REPO}:${TAG}-arm64"
          docker buildx imagetools create -t "${REPO}:${TAG}-alpine" \
            "${REPO}:${TAG}-alpine-amd64" \
            "${REPO}:${TAG}-alpine-arm64"
          docker buildx imagetools create -t "${REPO}:${TAG}-debian" \
            "${REPO}:${TAG}-debian-amd64" \
            "${REPO}:${TAG}-debian-arm64"
          # Also tag :latest on Alpine preferred image for the newest release.
          docker buildx imagetools create -t "${REPO}:latest" \
            "${REPO}:${TAG}-alpine-amd64" \
            "${REPO}:${TAG}-alpine-arm64"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## milk-ddp ${{ needs.build.outputs.tag }}

            Headless projectM → DDP for WLED matrices.

            **Licence:** GPL-3.0-or-later (application and in-tree presets).
            **libprojectM:** ${{ needs.build.outputs.projectm }} (LGPL-2.1-or-later) — see `THIRD_PARTY.md` in the tarball.

            ### Host binaries
            - `milk-ddp-*-linux-amd64.tar.gz`
            - `milk-ddp-*-linux-arm64.tar.gz`

            ### Container images (docker load)
            Alpine is preferred (`:latest` / untagged version on GHCR).
            - `*-alpine-amd64.tar.gz` / `*-alpine-arm64.tar.gz`
            - `*-debian-amd64.tar.gz` / `*-debian-arm64.tar.gz`

            ### GHCR
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}-alpine
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }}-debian
            ```

            Large Milkdrop packs (Cream of the Crop, textures) are **not** included; see `presets/README.md`.
          files: |
            milk-ddp-${{ needs.build.outputs.version }}-linux-amd64.tar.gz
            milk-ddp-${{ needs.build.outputs.version }}-linux-arm64.tar.gz
            milk-ddp-${{ needs.build.outputs.version }}-alpine-amd64.tar.gz
            milk-ddp-${{ needs.build.outputs.version }}-alpine-arm64.tar.gz
            milk-ddp-${{ needs.build.outputs.version }}-debian-amd64.tar.gz
            milk-ddp-${{ needs.build.outputs.version }}-debian-arm64.tar.gz
