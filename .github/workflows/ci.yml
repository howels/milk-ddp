name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ git pkg-config make \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri \
            libpulse-dev libasound2-dev \
            mesa-utils python3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Headless DDP validate
        run: bash tests/validate.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

      - name: List audio backends
        run: ./build/milk-ddp --list-audio || true

      - name: Upload binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: milk-ddp-linux-${{ matrix.arch }}
          path: |
            build/milk-ddp
            LICENSE
            THIRD_PARTY.md
            presets/
          if-no-files-found: error

  docker:
    name: docker-${{ matrix.name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine
            file: Dockerfile.alpine
            arch: amd64
            runner: ubuntu-24.04
          - name: debian
            file: Dockerfile.debian
            arch: amd64
            runner: ubuntu-24.04
          - name: alpine
            file: Dockerfile.alpine
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: debian
            file: Dockerfile.debian
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure third_party dir for COPY
        run: mkdir -p third_party && touch third_party/.gitkeep

      - name: Build ${{ matrix.name }} image (${{ matrix.arch }})
        run: docker build -f "${{ matrix.file }}" -t "milk-ddp:ci-${{ matrix.name }}-${{ matrix.arch }}" .

      - name: Smoke-test image
        run: |
          IMAGE="milk-ddp:ci-${{ matrix.name }}-${{ matrix.arch }}"
          docker run --rm "${IMAGE}" \
            --software-gl --preset-path /usr/share/milk-ddp/presets --help
          # Listen inside the container: connected UDP send() needs a peer, and
          # host-network sharing differs between Docker (Actions) and rootless Podman.
          docker run --rm --entrypoint sh "${IMAGE}" -c '
            set -eu
            test -f /usr/share/milk-ddp/presets/butterchurn/LICENSE
            milk_n=$(find /usr/share/milk-ddp/presets/butterchurn -maxdepth 1 -name "*.milk" | wc -l)
            test "${milk_n}" -ge 500
            python3 /usr/libexec/milk-ddp/ddp_listen.py \
              --bind 127.0.0.1 --port 19049 --width 64 --height 64 \
              --frames 2 --timeout 60 &
            LISTEN_PID=$!
            sleep 0.3
            milk-ddp --software-gl --width 64 --height 64 --fps 15 --frames 2 \
              --ddp 127.0.0.1:19049 \
              --preset-path /usr/share/milk-ddp/presets/lowres \
              --audio sine --quiet --no-warm-presets
            wait "${LISTEN_PID}"
          '
